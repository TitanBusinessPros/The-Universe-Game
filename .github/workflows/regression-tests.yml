name: Regression tests

# Runs automatically on every push to main and on every pull request, so a
# breaking change gets caught before it's the only thing anyone notices.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run regression test suite against index.html
        working-directory: tests
        run: node regression-test.js ../index.html

  visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/visual
        run: npm install

      - name: Install headless Chromium
        working-directory: tests/visual
        run: npx playwright install --with-deps chromium

      - name: Run visual regression test suite against index.html
        working-directory: tests/visual
        run: node visual-test.js ../../index.html

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/visual/baseline/*-actual.png
            tests/visual/baseline/*-diff.png
          if-no-files-found: ignore

  # One-time bootstrap: the baseline PNGs were originally generated on a
  # Windows machine, and Ubuntu's Chromium substitutes different fonts for
  # generic font-family names (no "Arial" installed), which is enough to
  # fail the pixel diff on text alone even with nothing actually wrong. The
  # fix is to generate the baseline from the SAME environment that checks
  # it - this job runs the visual test in --update mode right here in CI and
  # commits the result back to the repo, using the workflow's own token.
  #
  # This is a bootstrap step, not something that should run on every push -
  # remove the "push" trigger below (or delete this job) once the baseline
  # is confirmed correct and visual-test is passing normally.
  bootstrap-visual-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/visual
        run: npm install

      - name: Install headless Chromium
        working-directory: tests/visual
        run: npx playwright install --with-deps chromium

      - name: Regenerate baseline from this exact CI environment
        working-directory: tests/visual
        run: node visual-test.js ../../index.html --update

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baseline
          if git diff --cached --quiet; then
            echo "Baseline already matches this environment - nothing to commit."
          else
            git commit -m "Regenerate visual baseline from CI environment [skip ci]"
            git push
          fi
