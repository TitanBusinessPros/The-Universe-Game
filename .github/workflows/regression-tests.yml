name: Regression tests

# Runs automatically on every push to main and on every pull request, so a
# breaking change gets caught before it's the only thing anyone notices.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run regression test suite against index.html
        working-directory: tests
        run: node regression-test.js ../index.html

  visual-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/browser
        run: npm install

      - name: Install headless browsers (Chromium, Firefox, WebKit)
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run visual regression test suite against index.html
        working-directory: tests/browser
        run: node visual-test.js ../../index.html

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/browser/baseline/*/*-actual.png
            tests/browser/baseline/*/*-diff.png
          if-no-files-found: ignore

  interaction-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/browser
        run: npm install

      - name: Install headless browsers (Chromium, Firefox, WebKit)
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run interaction regression test suite against index.html
        working-directory: tests/browser
        run: node interaction-test.js ../../index.html --engines=chromium,firefox,webkit

  # Wires up testing.html - a real, pre-existing browser harness (predates this
  # tests/ suite) that was never run by anything automated. Unlike every job
  # above, this one deliberately does NOT mock out image/sprite requests - the
  # entire point is confirming every asset URL actually resolves over the real
  # network, which nothing else here checks. See asset-integrity-test.js for
  # why it has to serve both files over a throwaway local HTTP server rather
  # than open testing.html via file:// the way the other jobs open index.html
  # (short version: Chromium blocks the cross-frame access this harness needs
  # between two file:// documents; a real HTTP origin doesn't have that
  # restriction). Real network + several MB of art assets means this is
  # slower and less deterministic than the jobs above - a network hiccup here
  # is not the same kind of signal as a failure in regression-test.js.
  asset-integrity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/browser
        run: npm install

      - name: Install headless browser (Chromium)
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run testing.html's asset/mechanics harness against the real network
        working-directory: tests/browser
        run: node asset-integrity-test.js ../..

  balance-simulation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/balance
        run: npm install

      # Cheap (1 run, 10 turns) - this only exists to catch the simulation
      # ITSELF crashing (a real bug), on every push. The real statistical
      # report (many runs, all difficulties) is manual - see the
      # balance-report job and tests/README.md - since it takes several
      # minutes and its output is a report to read, not a pass/fail signal.
      - name: Smoke-test the balance simulation against index.html
        working-directory: tests/balance
        run: npm test

  # A full statistical report, not a correctness gate - see tests/README.md.
  # Manual only: it takes several minutes, and "nation X wins slightly more
  # often" is a finding for a human to read and weigh, not something that
  # should block every push. Trigger from the Actions tab (workflow_dispatch)
  # or run tests/balance's "report" npm script locally; the results print to
  # the job log (and the workflow summary) rather than being committed
  # anywhere, since there's no single "correct" baseline for a balance report
  # the way there is for the visual suite.
  balance-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/balance
        run: npm install

      - name: Run full balance report
        working-directory: tests/balance
        run: npm run report | tee "$GITHUB_STEP_SUMMARY"

  # Regenerating the baseline is a manual, deliberate action (see
  # tests/README.md) - it must never run automatically on every push, or a
  # real visual regression would just get silently "fixed" into the
  # baseline instead of failing. Trigger this by hand from the Actions tab
  # (workflow_dispatch) only when you've confirmed by eye that the new
  # screenshots are actually correct.
  bootstrap-visual-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/browser
        run: npm install

      - name: Install headless browsers (Chromium, Firefox, WebKit)
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Regenerate baseline (all engines) from this exact CI environment
        working-directory: tests/browser
        run: node visual-test.js ../../index.html --update

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baseline
          if git diff --cached --quiet; then
            echo "Baseline already matches this environment - nothing to commit."
          else
            git commit -m "Regenerate visual baseline from CI environment [skip ci]"
            git push
          fi
